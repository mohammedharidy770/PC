name: Build and publish GitHub Pages site

on:
  push:
    branches:
      - main
    paths-ignore:
      - "index.html"
      - "assets/**"
      - ".nojekyll"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-and-publish-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build production site
        run: npm run build

      - name: Publish compiled files to the Pages root
        run: |
          rm -rf assets
          cp -R dist/. .
          touch .nojekyll

      - name: Commit compiled site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- index.html assets .nojekyll
          if git diff --cached --quiet; then
            echo "No generated changes to publish."
            exit 0
          fi
          git commit -m "build: publish compiled GitHub Pages site"
          git push
